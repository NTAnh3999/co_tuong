name: Nightly engine oracle

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-oracle:
    name: Pikafish live oracle and perft depth 4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends p7zip-full file
      - name: Download and verify pinned Pikafish release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Pikafish.2026-09-06.7z"
          engine_dir="$RUNNER_TEMP/pikafish"
          mkdir -p "$engine_dir"
          curl --fail --location --silent --show-error \
            https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z \
            --output "$archive"
          echo '41952bbfe2520faceb5902c69e6ab4845cc999841d2b49a95cc1be7867a25e5b  '"$archive" | sha256sum --check --strict
          7z x "$archive" "-o$engine_dir" -y >/dev/null
          engine="$(find "$engine_dir" -type f -exec sh -c 'for f do if file -b "$f" | grep -q "^ELF 64-bit.*x86-64"; then printf "%s\n" "$f"; exit 0; fi; done; exit 0' sh {} + | sed -n '1p')"
          test -n "$engine" || { echo 'No Linux x86-64 Pikafish ELF found in release archive' >&2; exit 1; }
          weights="$(find "$engine_dir" -type f -name '*.nnue' -print -quit)"
          test -n "$weights" || { echo 'No NNUE weights found in release archive' >&2; exit 1; }
          find "$engine_dir" -type f -name '*.nnue' -exec cp {} services/pikafish-worker/ \;
          chmod +x "$engine"
          echo "PIKAFISH_PATH=$engine" >> "$GITHUB_ENV"
      - name: Build engine worker and rules core
        run: pnpm turbo run build --filter=@xq/xiangqi-core --filter=@xq/pikafish-worker
      - name: Run live oracle tests including depth 4
        run: pnpm --filter @xq/pikafish-worker exec vitest run src/uci/oracle.live.test.ts src/uci/multipv.live.test.ts
